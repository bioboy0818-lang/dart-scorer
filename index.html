<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121614">
<title>鏢眼計分</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* 版面：上方計分板（遠距離看得清楚），下方鏡頭畫面＋操作面板；橫向時左右並排 */
:root{
  color-scheme: dark;
  --bg:#121614; --panel:#1b211e; --line:#2d3631; --fg:#ece6d6; --muted:#9aa39d;
  --red:#d8433a; --green:#2f9e62; --warn:#e6b04a;
  --font-num:"Barlow Condensed","DIN Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input[type=text],input[type=number]{-webkit-user-select:text;user-select:text}
canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:44px;touch-action:manipulation}
button:active{background:var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
button.danger{border-color:var(--red);color:#ffb3ad}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
label.chk{display:flex;gap:8px;align-items:center}
.app{display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:100%;padding-block:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--font-num);font-size:26px;letter-spacing:.04em;margin:0;font-weight:700}
header h1 span{color:var(--red)}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.steps button{min-height:36px;padding:6px 12px;font-size:14px}
.steps button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

.board-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.pcard.active{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.pcard .nm{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:13px}
.pcard .big{font-family:var(--font-num);font-weight:700;font-size:clamp(44px,9vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.pcard .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px;text-align:center;font-family:var(--font-num);font-size:15px}
.cr div{background:var(--bg);border-radius:4px;padding:1px 0}
.cr .c{color:var(--green);font-weight:700}
.turnbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-num);font-size:22px;font-weight:700;min-width:70px;text-align:center;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.chip.empty{color:var(--line)}
.chip.d{border-color:var(--red)} .chip.t{border-color:var(--green)}
.turn-total{font-family:var(--font-num);font-size:28px;font-weight:700;margin-left:4px}
.hint{color:var(--muted);font-size:13px}
.checkout{font-family:var(--font-num);font-size:20px;color:var(--warn)}
.banner{background:var(--warn);color:#1a1405;font-weight:700;border-radius:10px;padding:10px 14px;font-size:18px;text-align:center}

.main{display:grid;grid-template-columns:1fr;gap:10px;min-height:0}
@media (min-width:900px) and (orientation:landscape){.main{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}}
.viewwrap{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:240px;aspect-ratio:4/3;max-width:100%}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.status{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{background:rgba(0,0,0,.65);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.pill.ok{border-color:var(--green)} .pill.warn{border-color:var(--warn);color:var(--warn)} .pill.err{border-color:var(--red);color:#ffb3ad}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:17px;margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nudge button{min-height:44px;padding:4px;font-size:18px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:10px;z-index:30;font-size:18px;max-width:90vw;text-align:center}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}
.calmsg{font-size:16px;font-weight:700}
.calmsg.ok{color:var(--green)} .calmsg.err{color:#ffb3ad}
.log{max-height:160px;overflow:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px}

/* 數字鍵盤 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.pad{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(560px,100%);padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.pad h3{margin:0;font-size:17px}
.mults{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nums button,.mults button{font-family:var(--font-num);font-size:24px;font-weight:700;min-height:52px;padding:4px}
.extra{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.extra button{min-height:52px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>鏢眼<span>計分</span></h1>
    <nav class="steps" aria-label="步驟">
      <button id="tab-setup" aria-current="true">1 設定</button>
      <button id="tab-cal">2 校正靶面</button>
      <button id="tab-game">3 比賽</button>
    </nav>
  </header>

  <section id="scoreArea" hidden>
    <div class="board-score" id="players"></div>
    <div class="turnbar" style="margin-top:8px">
      <div id="chips" class="turnbar"></div>
      <div class="turn-total" id="turnTotal"></div>
      <div class="checkout" id="checkout"></div>
    </div>
    <div class="banner" id="pullBanner" hidden style="margin-top:8px">請拔鏢，拔完會自動換下一位</div>
  </section>

  <div class="main">
    <div class="viewwrap" id="viewwrap">
      <canvas id="view"></canvas>
      <div class="status" id="status"></div>
    </div>

    <!-- 設定 -->
    <div class="panel" id="p-setup">
      <h2>鏡頭來源</h2>
      <div class="row">
        <label class="field"><span>來源</span>
          <select id="srcType">
            <option value="camera">手機／電腦鏡頭</option>
            <option value="demo">示範模擬靶（不需鏡頭）</option>
            <option value="file">錄好的影片檔</option>
          </select>
        </label>
        <label class="field" id="camPick"><span>鏡頭</span>
          <select id="camSelect"><option value="">後鏡頭（預設）</option></select>
        </label>
        <label class="field" id="demoAngleField"><span>示範靶拍攝角度</span>
          <select id="demoAngle">
            <option value="front">前下方</option>
            <option value="side" selected>左前方斜拍</option>
            <option value="right">右上方斜拍</option>
          </select>
        </label>
      </div>
      <input type="file" id="fileInput" accept="video/*" hidden>
      <div class="btns"><button class="primary" id="btnStart">開啟來源</button></div>
      <label class="field"><span>鏢尖方向</span>
        <select id="camPos">
          <option value="auto">自動（依校正結果推算手機位置）</option>
          <option value="below">手機在靶的下方</option>
          <option value="above">手機在靶的上方</option>
          <option value="left">手機在靶的左側</option>
          <option value="right">手機在靶的右側</option>
        </select>
      </label>

      <h2>遊戲</h2>
      <div class="row">
        <label class="field"><span>模式</span>
          <select id="gameType">
            <option value="301">301</option>
            <option value="501" selected>501</option>
            <option value="701">701</option>
            <option value="901">901</option>
            <option value="cricket">Cricket</option>
            <option value="countup">Count Up</option>
          </select>
        </label>
        <label class="field"><span>玩家人數</span>
          <select id="nPlayers"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
        </label>
        <label class="field" id="roundsField"><span>回合數上限</span>
          <input type="number" id="rounds" min="1" max="99" value="20">
        </label>
      </div>
      <div class="row" id="opts01">
        <label class="chk"><input type="checkbox" id="doubleOut" checked> 雙倍出局（Double Out）</label>
        <label class="chk"><input type="checkbox" id="doubleIn"> 雙倍進場（Double In）</label>
      </div>
      <div class="row" id="names"></div>
      <label class="chk"><input type="checkbox" id="speak" checked> 語音報分</label>
    </div>

    <!-- 校正 -->
    <div class="panel" id="p-cal" hidden>
      <h2>校正靶面</h2>
      <p class="note">把整個鏢靶放在畫面中央，紅綠色的雙倍圈要完整入鏡。網頁會自動找出靶的位置、大小和角度，斜拍也可以。</p>
      <div class="calmsg" id="calMsg">正在尋找鏢靶…</div>
      <div class="btns">
        <button id="btnAuto">重新自動校正</button>
        <button class="primary" id="btnCalDone" disabled>完成，開始比賽</button>
      </div>
      <details id="fineBox">
        <summary>格線沒對準？微調</summary>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          <div class="nudge">
            <button data-n="up" aria-label="上移">↑</button><button data-n="down" aria-label="下移">↓</button>
            <button data-n="left" aria-label="左移">←</button><button data-n="right" aria-label="右移">→</button>
            <button data-n="ccw" aria-label="逆時針轉">⟲</button><button data-n="cw" aria-label="順時針轉">⟳</button>
            <button data-n="small" aria-label="縮小">－</button><button data-n="big" aria-label="放大">＋</button>
          </div>
          <div class="btns">
            <span class="hint">20 不在正上方？</span>
            <button data-n="seg-">數字往左轉</button><button data-n="seg+">數字往右轉</button>
          </div>
          <div class="btns">
            <button id="btnManualCal">改用手動點四點</button>
          </div>
          <p class="note" id="manualNote" hidden>依序點 20、6、3、11 這四個扇區雙倍區的外緣。點完後可用上面的按鈕微調，不必拖曳。</p>
        </div>
      </details>
    </div>

    <!-- 比賽 -->
    <div class="panel" id="p-game" hidden>
      <div class="btns">
        <button id="btnInput">輸入一鏢</button>
        <button id="btnMiss">脫靶（0 分）</button>
        <button id="btnUndo">復原上一鏢</button>
      </div>
      <div class="btns">
        <button id="btnEndTurn">結束這回合</button>
        <button class="primary" id="btnCleared">已拔鏢，換下一位</button>
      </div>
      <p class="note">分數判錯時，點上方那一鏢的分數，用鍵盤選正確的分數。拔鏢後會自動換人，偵測不到時再按「已拔鏢」。</p>
      <label class="chk"><input type="checkbox" id="autoDetect" checked> 自動偵測飛鏢</label>
      <div class="btns" id="demoBtns" hidden>
        <button id="btnThrow">模擬擲一鏢</button>
        <button id="btnPull">模擬拔鏢</button>
        <span class="hint" id="demoTruth"></span>
      </div>
      <div class="btns">
        <button id="btnRef">重設參考畫面</button>
        <button class="danger" id="btnNew">重新開局</button>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="pad" role="dialog" aria-labelledby="padTitle">
    <h3 id="padTitle">修正分數</h3>
    <div class="mults">
      <button data-m="1" class="on">單倍</button><button data-m="2">雙倍 D</button><button data-m="3">三倍 T</button>
    </div>
    <div class="nums" id="padNums"></div>
    <div class="extra">
      <button data-v="bull">外紅心 25</button><button data-v="dbull">內紅心 50</button><button data-v="miss">脫靶 0</button><button data-v="cancel">取消</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<video id="video" playsinline muted autoplay hidden></video>

<script>
"use strict";
/* ========== 靶面幾何（單位 mm，標準硬靶尺寸）========== */
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R={ibull:6.35, obull:15.9, tIn:99, tOut:107, dIn:162, dOut:170};
const CAL_TARGETS=[[0,-R.dOut],[R.dOut,0],[0,R.dOut],[-R.dOut,0]]; // 20、6、3、11 的雙倍外緣
const D2R=Math.PI/180;
const bpt=(deg,r)=>[r*Math.sin(deg*D2R),-r*Math.cos(deg*D2R)]; // 靶面角度（自 20 順時針）→ mm

function scoreAt(x,y){
  const r=Math.hypot(x,y);
  if(r<=R.ibull) return {seg:25,mult:2,val:50,label:"D-BULL"};
  if(r<=R.obull) return {seg:25,mult:1,val:25,label:"BULL"};
  if(r>R.dOut)   return {seg:0,mult:0,val:0,label:"脫靶"};
  let a=Math.atan2(x,-y)/D2R; a=(a+360+9)%360;
  const seg=ORDER[Math.floor(a/18)%20];
  let mult=1; if(r>R.tIn&&r<=R.tOut) mult=3; else if(r>R.dIn) mult=2;
  return {seg,mult,val:seg*mult,label:(mult===3?"T":mult===2?"D":"S")+seg};
}
function makeDart(seg,mult){
  if(mult===0||seg===0) return {seg:0,mult:0,val:0,label:"脫靶"};
  if(seg===25) return mult===2?{seg:25,mult:2,val:50,label:"D-BULL"}:{seg:25,mult:1,val:25,label:"BULL"};
  return {seg,mult,val:seg*mult,label:(mult===3?"T":mult===2?"D":"S")+seg};
}

/* ========== 線性代數 ========== */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[p][i]))p=k;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];if(Math.abs(A[i][i])<1e-12)return null;for(let k=i+1;k<n;k++){const f=A[k][i]/A[i][i];for(let j=i;j<n;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i];}}const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i];}return x;}
// 最小平方法求單應性：src→dst，點數 ≥ 4
function fitH(src,dst){
  // 先把座標正規化，數值才穩定
  const norm=P=>{let mx=0,my=0;for(const p of P){mx+=p[0];my+=p[1];}mx/=P.length;my/=P.length;let d=0;for(const p of P)d+=Math.hypot(p[0]-mx,p[1]-my);d=d/P.length||1;const s=Math.SQRT2/d;return{T:[s,0,-s*mx,0,s,-s*my,0,0,1],f:p=>[(p[0]-mx)*s,(p[1]-my)*s]};};
  const ns=norm(src),nd=norm(dst);
  const N=Array.from({length:8},()=>new Array(8).fill(0)),bb=new Array(8).fill(0);
  for(let i=0;i<src.length;i++){const[x,y]=ns.f(src[i]),[X,Y]=nd.f(dst[i]);
    const rows=[[x,y,1,0,0,0,-x*X,-y*X,X],[0,0,0,x,y,1,-x*Y,-y*Y,Y]];
    for(const r of rows){for(let a=0;a<8;a++){bb[a]+=r[a]*r[8];for(let c=0;c<8;c++)N[a][c]+=r[a]*r[c];}}}
  const h=solve(N,bb);if(!h)return null;
  const Hn=[...h,1];
  return mul3(invH(nd.T),mul3(Hn,ns.T));
}
function homography(src,dst){return fitH(src,dst);}
function mul3(A,B){const C=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)C[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return C;}
function applyH(H,x,y){const w=H[6]*x+H[7]*y+H[8];return[(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w];}
function invH(m){const[a,b,c,d,e,f,g,h,i]=m;const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;const det=a*A+b*B+c*C;if(Math.abs(det)<1e-15)return null;const r=[A,-(b*i-c*h),b*f-c*e,B,a*i-c*g,-(a*f-c*d),C,-(a*h-b*g),a*e-b*d];return r.map(v=>v/det);}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);};

/* ========== 遊戲規則（用事件重播計算狀態，方便復原與修正）========== */
const CR_TARGETS=[20,19,18,17,16,15,25];
function newGameConfig(){
  const t=$("gameType").value, n=+$("nPlayers").value;
  const names=[];for(let i=0;i<n;i++){const el=$("name"+i);names.push((el&&el.value.trim())||("玩家"+(i+1)));}
  return {type:t, is01:/^\d+$/.test(t), start:+t||0, doubleOut:$("doubleOut").checked, doubleIn:$("doubleIn").checked,
    rounds:Math.max(1,Math.min(99,+$("rounds").value||(t==="countup"?8:20))), names};
}
function replay(cfg,events){
  const P=cfg.names.map(nm=>({name:nm,rem:cfg.start,opened:!cfg.doubleIn,score:0,marks:Object.fromEntries(CR_TARGETS.map(t=>[t,0])),darts:0,scored:0,lastTurn:null,markCount:0}));
  const st={P,cur:0,round:1,turn:[],turnStart:null,finished:false,winner:null,lastMsg:null,turnEnded:false};
  const begin=()=>{st.turn=[];st.turnStart={rem:P[st.cur].rem,score:P[st.cur].score,opened:P[st.cur].opened};st.turnEnded=false;};
  begin();
  const endTurn=(flag)=>{
    const p=P[st.cur];
    p.lastTurn={darts:st.turn.slice(),total:flag==="bust"?0:st.turn.reduce((s,d)=>s+(d.counted??d.val),0),flag};
    if(st.finished){st.turnEnded=true;return;}
    st.cur=(st.cur+1)%P.length;
    if(st.cur===0){
      if(!cfg.is01 && st.round>=cfg.rounds){

// 橢圓擬合：A x²+B xy+C y²+D x+E y=1（以中心附近為原點），RANSAC 排除干擾點

  const L=[v1[0]*s1,v2[0]*s2,v1[1]*s1,v2[1]*s2];

    const E=fitConic(s,ox,oy);if(!E)continue;let n=0;for(const p of P)if(Math.abs(ellipseRatio(E,p[0],p[1])-1)<.035)n++;if(n>bestIn){bestIn=n;best=E;}}

// 由校正結果推算手機相對靶的位置，用來判斷飛鏢在畫面上往哪個方向伸出
function camModel(Hn){
  if(!src.type)return null;const[W,Hh]=src.size();const f=0.8*Math.max(W,Hh);
  const Hp=mul3([W,0,0,0,Hh,0,0,0,1],Hn);
  const Ki=[1/f,0,-W/2/f,0,1/f,-Hh/2/f,0,0,1];const M=mul3(Ki,Hp);
  const h1=[M[0],M[3],M[6]],h2=[M[1],M[4],M[7]],h3=[M[2],M[5],M[8]];
  let lam=2/(Math.hypot(...h1)+Math.hypot(...h2));if(h3[2]*lam<0)lam=-lam;

  const Cz=-(r3[0]*t[0]+r3[1]*t[1]+r3[2]*t[2]);

  return{project(X,Y,Z){const z=Z*side;const p=[r1[0]*X+r2[0]*Y+r3[0]*z+t[0],r1[1]*X+r2[1]*Y+r3[1]*z+t[1],r1[2]*X+r2[2]*Y+r3[2]*z+t[2]];return[(f*p[0]/p[2]+W/2)/W,(f*p[1]/p[2]+Hh/2)/Hh];}};

const PW=480;

  state:"off",stable:0,clearTicks:0,lastStatus:"",blob:null,turnBlobs:[],T:16,noise:2,
  reset(){this.ref=this.emptyRef=this.prev=null;this.state="off";this.stable=0;this.turnBlobs=[];},

$("btnThrow").onclick=()=>{demo.throwDart();if(!$("autoDetect").checked)$("demoTruth").textContent="實際落點 "+demo.truth;};
$("btnPull").onclick=()=>{demo.darts=[];};

let actx=null;function beep(hit){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=hit?880:220;g.gain.value=.08;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.09);}catch(e){}}

/* ========== 數字鍵盤：修正或手動輸入 ========== */
let pad={k:-1,mult:1};
(function(){const box=$("padNums");for(let n=1;n<=20;n++){const b=document.createElement("button");b.textContent=n;b.onclick=()=>padPick(n,pad.mult);box.appendChild(b);}})();
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{pad.mult=+b.dataset.m;document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b));});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==="cancel")return closePad();if(v==="bull")padPick(25,1);else if(v==="dbull")padPick(25,2);else padPick(0,0);});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closePad();});
function openPad(k){pad={k,mult:1};document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m==="1"));
  $("padTitle").textContent=k<0?"輸入一鏢":"修正第 "+(k+1)+" 鏢（目前 "+(shownDarts()[k]||{}).label+"）";$("sheet").hidden=false;}
function closePad(){$("sheet").hidden=true;}
function padPick(seg,mult){
  const d=makeDart(seg,mult);closePad();
  if(pad.k<0){addDart({x:999,y:999,...d,auto:false});return;}
  const idx=shownEventIdx()[pad.k];if(idx==null)return;
  const wasEnded=game.st.turnEnded;const p=game.showingPrev?(game.st.cur-1+game.st.P.length)%game.st.P.length:game.st.cur;
  Object.assign(game.events[idx],d,{auto:false,fixed:true});recompute();log("修正為 "+d.label);
  // 修正後若回合狀態改變（例如變成爆鏢或收鏢），跟著處理
  if(game.st.turnEnded&&!wasEnded)afterChange(p);
}
function shownDarts(){const st=game.st;if(!st)return[];if(st.turn.length)return st.turn;if(game.showingPrev){const p=st.finished&&st.winner>=0&&st.lastMsg==="GAME SHOT"?st.P[st.cur]:st.P[(st.cur-1+st.P.length)%st.P.length];return(p.lastTurn||{darts:[]}).darts;}return[];}
function shownEventIdx(){const n=shownDarts().length;const out=[];for(let i=game.events.length-1;i>=0&&out.length<n;i--){const e=game.events[i];if(e.t==="end"){if(out.length)break;continue;}out.unshift(i);}return out;}

function renderScore(){
  const st=game.st,c=game.cfg;$("scoreArea").hidden=!st;if(!st)return;
  const wrap=$("players");wrap.innerHTML="";
  st.P.forEach((p,i)=>{
    const card=document.createElement("div");card.className="pcard"+(i===st.cur&&!st.finished?" active":"");
    const nm=document.createElement("div");nm.className="nm";const a=document.createElement("span");a.textContent=p.name+(st.finished&&st.winner===i?" 🏆":"");
    const b=document.createElement("span");b.textContent=c.is01?"":"R"+Math.min(st.round,c.rounds)+"/"+c.rounds;nm.append(a,b);
    const big=document.createElement("div");big.className="big";big.textContent=c.is01?p.rem:p.score;
    const sub=document.createElement("div");sub.className="sub";
    if(c.is01){const avg=p.darts?(p.scored/p.darts*3).toFixed(1):"–";sub.textContent="平均 "+avg+(p.lastTurn?"　上回 "+(p.lastTurn.flag==="bust"?"BUST":p.lastTurn.total):"")+(!p.opened?"　未進場":"");}
    else if(c.type==="cricket")sub.textContent="MPR "+(p.darts?(p.markCount/p.darts*3).toFixed(2):"–");
    else sub.textContent=p.lastTurn?"上回 "+p.lastTurn.total:"";
    card.append(nm,big,sub);
    if(c.type==="cricket"){const g=document.createElement("div");g.className="cr";for(const t of CR_TARGETS){const d=document.createElement("div");const m=p.marks[t];d.textContent=(t===25?"B":t)+" "+["","/","X","Ⓧ"][m];if(m>=3)d.className="c";g.appendChild(d);}card.appendChild(g);}
    wrap.appendChild(card);
  });
  const chips=$("chips");chips.innerHTML="";const show=shownDarts();
  for(let k=0;k<3;k++){const d=show[k];const b=document.createElement("button");b.className="chip"+(d?(d.mult===2?" d":d.mult===3?" t":""):" empty");
    b.textContent=d?d.label:"–";b.disabled=!d;b.onclick=()=>openPad(k);chips.appendChild(b);}
  const tot=show.reduce((s,d)=>s+(d.counted??d.val),0);
  $("turnTotal").textContent=show.length?(!st.turn.length?"上一位 ":"")+tot:"";
  let co="";if(c.is01&&!st.finished){const p=st.P[st.cur];const left=3-st.turn.length;if(p.rem<=170&&p.opened){const r=checkout(p.rem,left,c.doubleOut);if(r)co="收鏢："+r.join(" → ");}}
  $("checkout").textContent=co;
  $("pullBanner").hidden=!(det.state==="clear"&&!st.finished&&step==="game");
}

/* ========== 畫面繪製與觸控 ========== */
const view=$("view");let vctx=view.getContext("2d");let fit={x:0,y:0,w:1,h:1};
function resize(){const r=view.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);view.width=Math.round(r.width*dpr);view.height=Math.round(r.height*dpr);}
new ResizeObserver(resize).observe(view);
view.addEventListener("contextmenu",e=>e.preventDefault());
function n2d(u,v){return[fit.x+u*fit.w,fit.y+v*fit.h];}
function d2n(px,py){return[(px-fit.x)/fit.w,(py-fit.y)/fit.h];}
function boardToDisp(X,Y){const[u,v]=applyH(cal.Hinv,X,Y);return n2d(u,v);}
function draw(){
  requestAnimationFrame(draw);
  const W=view.width,H=view.height,g=vctx;g.setTransform(1,0,0,1,0,0);g.fillStyle="#000";g.fillRect(0,0,W,H);
  if(!src.type||!src.ready()){g.fillStyle="#9aa39d";g.font=Math.round(16*W/500)+"px sans-serif";g.textAlign="center";g.fillText(src.type?"載入中…":"先在「設定」開啟鏡頭來源",W/2,H/2);return;}
  const[sw,sh]=src.size();const s=Math.min(W/sw,H/sh);fit={w:sw*s,h:sh*s,x:(W-sw*s)/2,y:(H-sh*s)/2};
  g.drawImage(src.el,fit.x,fit.y,fit.w,fit.h);
  const k=W/600;
  if(step==="cal"&&!cal.Hinv&&!cal.manual){ // 對準框
    g.strokeStyle="rgba(255,255,255,.5)";g.setLineDash([8*k,8*k]);g.lineWidth=2*k;const r=Math.min(fit.w,fit.h)*.38;g.beginPath();g.arc(W/2,H/2,r,0,7);g.stroke();g.setLineDash([]);
  }
  if(cal.Hinv){
    g.strokeStyle=step==="cal"?"rgba(255,230,90,.95)":"rgba(255,230,90,.35)";g.lineWidth=Math.max(1,1.3*k);
    for(const r of[R.ibull,R.obull,R.tIn,R.tOut,R.dIn,R.dOut]){g.beginPath();for(let i=0;i<=90;i++){const[x,y]=boardToDisp(...bpt(i*4,r));i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
    for(let i=0;i<20;i++){const[x0,y0]=boardToDisp(...bpt(i*18-9,R.obull)),[x1,y1]=boardToDisp(...bpt(i*18-9,R.dOut));g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}
    if(step==="cal"){g.font="bold "+Math.round(14*k)+"px sans-serif";g.textAlign="center";g.textBaseline="middle";for(let i=0;i<20;i++){const[x,y]=boardToDisp(...bpt(i*18,188));g.fillStyle="rgba(0,0,0,.6)";g.fillRect(x-11*k,y-9*k,22*k,18*k);g.fillStyle=i===0?"#ff5a4f":"rgba(255,230,90,.95)";g.fillText(ORDER[i],x,y);}}
  }
  if(step==="cal"&&cal.manual){const lab=["20","6","3","11"];cal.pts.forEach(([u,v],i)=>{const[x,y]=n2d(u,v);g.strokeStyle="#fff";g.lineWidth=2*k;g.beginPath();g.arc(x,y,9*k,0,7);g.stroke();g.fillStyle="#fff";g.font="bold "+Math.round(14*k)+"px sans-serif";g.fillText(lab[i],x+18*k,y-14*k);});}
  if(step==="game"&&game.st&&cal.Hinv){
    shownDarts().forEach((d,i)=>{if(d.x>900||d.fixed)return;const[x,y]=boardToDisp(d.x,d.y);g.strokeStyle="#4dff9a";g.lineWidth=2.5*k;g.beginPath();g.arc(x,y,7*k,0,7);g.stroke();g.fillStyle="rgba(0,0,0,.65)";g.fillRect(x+9*k,y-22*k,48*k,18*k);g.fillStyle="#fff";g.font="bold "+Math.round(13*k)+"px sans-serif";g.textAlign="left";g.textBaseline="middle";g.fillText(d.label,x+12*k,y-13*k);});
  }
}
requestAnimationFrame(draw);
function evPos(e){const r=view.getBoundingClientRect(),sx=view.width/r.width;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sx};}
// 只有手動校正模式需要點畫面，其他時候點畫面不會有任何動作
view.addEventListener("pointerup",e=>{
  if(step!=="cal"||!cal.manual||!src.type)return;e.preventDefault();
  if(cal.pts.length<4){const p=evPos(e);cal.pts.push(d2n(p.x,p.y));if(cal.pts.length===4){cal.fromPts();const m=$("calMsg");m.className="calmsg ok";m.textContent="四點完成，可用微調按鈕對齊格線。";}}
});

/* ========== 步驟與設定 ========== */
let step="setup";
function setStep(s){step=s;$("p-setup").hidden=s!=="setup";$("p-cal").hidden=s!=="cal";$("p-game").hidden=s!=="game";
  for(const[t,n]of[["tab-setup","setup"],["tab-cal","cal"],["tab-game","game"]])$(t).setAttribute("aria-current",String(n===s));
  if(s==="game"&&game.st&&det.state==="off")det.state="ready";det.lastStatus="";renderStatus("","");if(game.st)renderScore();}
$("tab-setup").onclick=()=>setStep("setup");
$("tab-cal").onclick=()=>{if(!src.type){toast("請先開啟鏡頭來源");return;}setStep("cal");};
$("tab-game").onclick=()=>{if(!cal.H){toast("請先完成校正");return;}if(!game.cfg)startGame();setStep("game");};
$("btnStart").onclick=startSource;
function syncOpts(){const t=$("gameType").value,is01=/^\d+$/.test(t);$("opts01").hidden=!is01;$("roundsField").hidden=is01;
  if(!is01&&document.activeElement!==$("rounds"))$("rounds").value=t==="countup"?8:20;
  const n=+$("nPlayers").value,box=$("names"),old=[...box.querySelectorAll("input")].map(i=>i.value);box.innerHTML="";
  for(let i=0;i<n;i++){const l=document.createElement("label");l.className="field";const s=document.createElement("span");s.textContent="玩家 "+(i+1);const inp=document.createElement("input");inp.type="text";inp.id="name"+i;inp.value=old[i]??(store.get("names",[])[i]||"玩家"+(i+1));inp.oninput=saveSettings;l.append(s,inp);box.appendChild(l);}
  $("camPick").hidden=$("srcType").value!=="camera";$("demoAngleField").hidden=$("srcType").value!=="demo";}
function saveSettings(){store.set("settings",{srcType:$("srcType").value,camPos:$("camPos").value,gameType:$("gameType").value,nPlayers:$("nPlayers").value,doubleOut:$("doubleOut").checked,doubleIn:$("doubleIn").checked,speak:$("speak").checked});
  store.set("names",[...$("names").querySelectorAll("input")].map(i=>i.value));}
(function loadSettings(){const s=store.get("settings",null);if(s){for(const k of["srcType","camPos","gameType","nPlayers"])if(s[k])$(k).value=s[k];for(const k of["doubleOut","doubleIn","speak"])if(k in s)$(k).checked=s[k];}
  if(!window.isSecureContext&&location.protocol!=="file:"){$("srcType").value="demo";}})();
for(const id of["srcType","camPos","gameType","nPlayers","doubleOut","doubleIn","speak","demoAngle"])$(id).addEventListener("change",()=>{syncOpts();saveSettings();if(["gameType","nPlayers","doubleOut","doubleIn"].includes(id)&&game.cfg&&!game.events.length)startGame();});
$("rounds").addEventListener("change",()=>{if(game.cfg&&!game.events.length)startGame();});
$("autoDetect").addEventListener("change",()=>{det.lastStatus="";renderStatus("","");if($("autoDetect").checked)det.arm(true);});
syncOpts();
if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol!=="file:"&&location.hostname!=="localhost"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
window.__dart={scoreAt,replay,checkout,demo,det,game,cal,auto,runAuto,fitH,applyH,invH};
</script>
